<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YouTube Extension</title>
    <link rel="stylesheet" href="popup.css">
</head>

<body>
    <div class="container">
        <h1>YouTube Extension</h1>
        <p class="description">Your YouTube enhancement tool</p>

        <div class="controls">
            <label class="toggle">
                <input type="checkbox" id="enableFeature">
                <span class="slider"></span>
                <span class="label">Enable Feature</span>
            </label>
        </div>

        <div class="status" id="status">
            <span class="dot"></span>
            <span class="text">Ready</span>
        </div>

        <button id="actionBtn" class="btn-primary">Run Action</button>
    </div>

    <script src="popup.js"></script>
</body>

</html>
