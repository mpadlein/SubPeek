<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <title>SubPeek slide 2</title>
    <link rel="stylesheet" href="base.css" />
    <style>
        h1 {
            left: 72px;
            top: 40px;
            width: 1000px;
        }

        .lead {
            left: 72px;
            top: 116px;
            width: 1000px;
        }

        .sub {
            left: 72px;
            top: 160px;
            width: 1000px;
        }

        /* filter-search.png is capture3.mjs's 2x clip of the search results
           for "psychology" with the switch on, in masthead mode: YouTube's
           search box, the switch row and the first two cards that stay,
           1224 x 707 css px. Shown at 1021 / 1224 = 0.834x, the most that
           keeps both cards' labels above the bottom edge. */
        .results {
            left: 72px;
            top: 210px;
            width: 1021px;
            height: 590px;
        }

        .results img {
            width: 1021px;
        }

        /* Square and red so it reads as a mark-up, not as one more rounded
           YouTube control. */
        .overlay rect {
            stroke: #e0202b;
            stroke-width: 4;
        }
    </style>
</head>

<body>
    <div class="brand">
        <svg viewBox="0 0 128 128" aria-hidden="true">
            <rect x="3" y="3" width="122" height="122" rx="32" fill="#e0202b" stroke="#fff" stroke-width="6" />
            <circle cx="46" cy="56" r="16" fill="#fff" />
            <circle cx="82" cy="56" r="16" fill="#fff" />
            <circle cx="52" cy="57" r="7" fill="#0f0f0f" />
            <circle cx="88" cy="57" r="7" fill="#0f0f0f" />
            <rect x="18" y="62" width="92" height="46" rx="15" fill="#0f0f0f" />
            <rect x="30" y="76" width="68" height="9" rx="4.5" fill="#fff" />
            <rect x="30" y="91" width="68" height="9" rx="4.5" fill="#fff" />
        </svg>
        <span>SubPeek</span>
    </div>

    <h1>Filter by language</h1>
    <p class="lead">Show only videos with captions or dubs in your languages</p>
    <p class="sub">(Search results and channel pages only)</p>

    <div class="panel results"><img src="../captures/filter-search.png" alt="" /></div>

    <!-- Highlight around the switch and its count: in the clip they span css
         x 44..364, y 60..94 (the switch row's top and height come from
         q-psychology-geometry.json, the horizontal extent from the capture),
         scaled by 0.834 and offset to the panel, with 7 px of padding. -->
    <svg class="overlay" viewBox="0 0 1280 800">
        <rect x="102" y="253" width="281" height="42" />
    </svg>
</body>

</html>
